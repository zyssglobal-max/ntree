<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>u-link · Redirigiendo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c3aed' stroke-width='2'><path d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'/><path d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'/></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a12;
            --bg-card: rgba(255,255,255,0.03);
            --bg-input: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.06);
            --text: #f0f0f5;
            --text2: rgba(255,255,255,0.6);
            --text3: rgba(255,255,255,0.3);
            --accent: #7c3aed;
            --accent2: #a78bfa;
            --glow: rgba(124,58,237,0.25);
            --grad: linear-gradient(135deg, #7c3aed, #ec4899);
            --radius: 20px;
            --shadow: 0 8px 32px rgba(0,0,0,0.5);
            --success: #10b981;
            --danger: #ef4444;
        }
        body {
            background: #0a0a12;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at 60% 20%, rgba(74, 124, 191, 0.08), transparent 60%),
                radial-gradient(ellipse at 40% 80%, rgba(201, 168, 76, 0.06), transparent 50%),
                linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0d0d0d 100%);
        }
        .container {
            text-align: center;
            max-width: 480px;
            width: 100%;
            padding: 40px 32px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(24px);
            box-shadow: var(--shadow);
            animation: fadeUp 0.5s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            background: var(--grad);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px var(--glow);
            animation: float 3s ease-in-out infinite;
        }
        .logo svg {
            width: 36px;
            height: 36px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .spinner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.05);
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { 
            font-size: 22px; 
            margin-bottom: 8px; 
            color: var(--text);
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .subtitle { 
            color: var(--text2); 
            font-size: 14px; 
            margin-bottom: 4px;
            line-height: 1.6;
        }
        .short-id-wrapper {
            margin: 12px 0;
        }
        .short-id {
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            color: var(--accent2);
            font-size: 16px;
            padding: 6px 16px;
            background: rgba(124,58,237,0.1);
            border: 1px solid rgba(124,58,237,0.15);
            border-radius: 8px;
            display: inline-block;
        }
        .error {
            color: var(--danger);
            font-size: 14px;
            margin-top: 12px;
            padding: 14px 18px;
            border-radius: 12px;
            /* background: rgba(239,68,68,0.08); */
            border: 1px solid rgba(239,68,68,0.15);
            display: none;
            text-align: left;
        }
        .error-icon {
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        .error-icon svg {
            width: 18px;
            height: 18px;
            stroke: var(--danger);
            fill: none;
            stroke-width: 2;
        }
        .success {
            color: var(--success);
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        .success-icon {
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        .success-icon svg {
            width: 18px;
            height: 18px;
            stroke: var(--success);
            fill: none;
            stroke-width: 2.5;
        }
        .relay-info {
            font-size: 11px;
            color: var(--text3);
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            letter-spacing: 0.3px;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .status-dot.online { background: var(--success); }
        .status-dot.offline { background: var(--danger); }
        .status-dot.connecting { background: #f59e0b; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .relay-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text2);
            margin-top: 8px;
        }
        .hidden { display: none !important; }
        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            .logo { width: 60px; height: 60px; }
            .logo svg { width: 30px; height: 30px; }
            h2 { font-size: 19px; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
        </div>
        <div class="spinner" id="spinner"></div>
        <h2 id="title">Redirigiendo...</h2>
        <p class="subtitle" id="subtitle">Buscando enlace en la red descentralizada</p>
        <div class="short-id-wrapper" id="shortIdWrapper">
            <span class="short-id" id="shortIdDisplay"></span>
        </div>
        <div class="error" id="error">
            <span class="error-icon">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
            </span>
            <span id="errorText"></span>
        </div>
        <div class="success" id="success">
            <span class="success-icon">
                <svg viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </span>
            <span id="successText">の...</span>
        </div>
        <div class="relay-info" id="relayInfo">Conectando a relays...</div>
        <div class="relay-status" id="relayStatus">
            <span class="status-dot connecting" id="statusDot"></span>
            <span id="statusText">Conectando...</span>
        </div>
    </div>
    <script>
        const CONFIG = {
            relays: [
                'wss://relay.damus.io',
                'wss://nos.lol',
                'wss://relay.primal.net',
                'wss://relay.snort.social'
            ],
            nostrTreeTag: 'ulink_shortener',
            maxAttempts: 4,
            timeout: 10000
        };
        const DOM = {
            spinner: document.getElementById('spinner'),
            title: document.getElementById('title'),
            subtitle: document.getElementById('subtitle'),
            error: document.getElementById('error'),
            errorText: document.getElementById('errorText'),
            success: document.getElementById('success'),
            successText: document.getElementById('successText'),
            relayInfo: document.getElementById('relayInfo'),
            relayStatus: document.getElementById('relayStatus'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            shortIdDisplay: document.getElementById('shortIdDisplay'),
            shortIdWrapper: document.getElementById('shortIdWrapper')
        };
        function getShortId() {
            const params = new URLSearchParams(window.location.search);
            const u = params.get('u');
            if (u) return u;
            const path = window.location.pathname;
            const match = path.match(/\/r\/([a-z0-9]+)/);
            return match ? match[1] : null;
        }
        const shortId = getShortId();
        function updateStatus(status, text) {
            DOM.statusDot.className = 'status-dot ' + status;
            DOM.statusText.textContent = text;
        }
        if (!shortId) {
            DOM.spinner.style.display = 'none';
            DOM.title.textContent = 'Enlace inválido';
            DOM.subtitle.textContent = 'No se encontró el ID del enlace';
            DOM.errorText.textContent = 'URL no válida. El enlace corto no tiene un ID válido.';
            DOM.error.style.display = 'block';
            DOM.relayInfo.textContent = 'Error: ID no encontrado';
            DOM.shortIdWrapper.classList.add('hidden');
            updateStatus('offline', 'Error');
        } else {
            DOM.shortIdDisplay.textContent = shortId;
            DOM.relayInfo.textContent = 'Buscando enlace: ' + shortId;
            updateStatus('connecting', 'Buscando...');
        }
        function toast(msg, type = 'info') {
            const el = document.createElement('div');
            const colors = {
                info: 'rgba(124,58,237,0.15)',
                error: 'rgba(239,68,68,0.15)',
                success: 'rgba(16,185,129,0.15)'
            };
            el.style.cssText = `
                position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
                padding: 14px 24px; background: rgba(20,20,35,0.95);
                backdrop-filter: blur(20px);
                border-radius: 12px; color: #f0f0f5; font-size: 14px;
                box-shadow: 0 8px 32px rgba(0,0,0,0.5);
                border: 1px solid ${colors[type] || colors.info};
                z-index: 9999; animation: fadeUp 0.3s ease; max-width: 90%;
                text-align: center;
            `;
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateX(-50%) translateY(20px)';
                setTimeout(() => el.remove(), 300);
            }, 3500);
        }
        let wsConnections = [];
        let foundUrl = null;
        let attempts = 0;
        let currentSubId = null;
        let timeoutId = null;
        let isResolved = false;
        function connectRelays() {
            if (isResolved) return;
            let connectedCount = 0;
            DOM.relayInfo.textContent = 'Conectando a ' + CONFIG.relays.length + ' relays...';
            updateStatus('connecting', 'Conectando...');
            CONFIG.relays.forEach(url => {
                try {
                    const ws = new WebSocket(url);
                    ws.onopen = () => {
                        connectedCount++;
                        console.log('✅ Conectado a ' + url);
                        DOM.relayInfo.textContent = 'Conectado a ' + connectedCount + ' relay(s)';
                        updateStatus('online', connectedCount + ' relays');
                        if (connectedCount >= 1 && !isResolved) {
                            searchLinks();
                        }
                    };
                    ws.onmessage = (e) => {
                        try {
                            const data = JSON.parse(e.data);
                            handleRelayMessage(data);
                        } catch (err) {
                            console.error('Error parseando mensaje:', err);
                        }
                    };
                    ws.onerror = (err) => {
                        console.warn('⚠️ Error en ' + url, err);
                    };
                    ws.onclose = () => {
                        console.warn('Desconectado de ' + url);
                        connectedCount--;
                        if (connectedCount === 0 && !foundUrl && !isResolved) {
                            handleDisconnect();
                        }
                    };
                    wsConnections.push(ws);
                } catch (e) {
                    console.error('❌ Error al conectar a ' + url + ':', e);
                }
            });
            if (timeoutId) clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
                if (!foundUrl && !isResolved) {
                    attempts++;
                    if (attempts < CONFIG.maxAttempts) {
                        toast('Reintentando (' + attempts + '/' + CONFIG.maxAttempts + ')...', 'info');
                        wsConnections.forEach(w => { try { w.close(); } catch(e){} });
                        wsConnections = [];
                        connectRelays();
                    } else {
                        showError('Enlace no encontrado', 'No se pudo encontrar el enlace en la red después de varios intentos.');
                    }
                }
                timeoutId = null;
            }, CONFIG.timeout);
        }
        function handleDisconnect() {
            if (isResolved) return;
            attempts++;
            if (attempts < CONFIG.maxAttempts) {
                const delay = Math.min(2000 * attempts, 8000);
                DOM.relayInfo.textContent = 'Reconectando en ' + (delay/1000) + 's... (' + attempts + '/' + CONFIG.maxAttempts + ')';
                updateStatus('connecting', 'Reintento ' + attempts + '/' + CONFIG.maxAttempts);
                setTimeout(() => {
                    wsConnections.forEach(w => { try { w.close(); } catch(e){} });
                    wsConnections = [];
                    connectRelays();
                }, delay);
            } else {
                showError('Enlace no encontrado', 'No se pudo encontrar el enlace en la red. Verifica que el ID sea correcto.');
            }
        }
        function showError(title, msg) {
            if (isResolved) return;
            isResolved = true;
            DOM.spinner.style.display = 'none';
            DOM.title.textContent = title;
            DOM.subtitle.textContent = 'Intenta verificar el enlace';
            DOM.errorText.textContent = msg;
            DOM.error.style.display = 'block';
            DOM.relayInfo.textContent = 'Error al encontrar el enlace';
            updateStatus('offline', 'Error');
            wsConnections.forEach(w => { try { w.close(); } catch(e){} });
            wsConnections = [];
        }
        function handleRelayMessage(data) {
            if (isResolved) return;
            try {
                if (data[0] === 'EVENT' && data.length >= 3) {
                    const event = data[2];
                    if (event.kind !== 30000) return;
                    const hasUlTag = event.tags && event.tags.some(tag =>
                        tag[0] === 'd' && tag[1] === CONFIG.nostrTreeTag
                    );
                    if (!hasUlTag) return;
                    try {
                        const profile = JSON.parse(event.content);
                        if (profile.links && Array.isArray(profile.links)) {
                            const link = profile.links.find(l => l.shortId === shortId);
                            if (link) {
                                foundUrl = link.url;
                                isResolved = true;
                                wsConnections.forEach(w => { try { w.close(); } catch(e){} });
                                wsConnections = [];
                                if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
                                DOM.spinner.style.display = 'none';
                                DOM.title.textContent = 'Redirigiendo ...';
                                DOM.subtitle.textContent = '໒ ' + (link.title || 'sin título');
                                DOM.successText.textContent = 'NTree Redir ...';
                                DOM.success.style.display = 'block';
                                DOM.relayInfo.textContent = 'Enlace encontrado! Redirigiendo...';
                                updateStatus('online', 'Encontrado!');
                                setTimeout(() => {
                                    window.location.href = foundUrl;
                                }, 600);
                                return;
                            }
                        }
                    } catch (err) {
                        console.error('Error parseando perfil:', err);
                    }
                }
                if (data[0] === 'EOSE' && data.length >= 2) {
                    console.log('EOSE recibido para:', data[1]);
                }
            } catch (e) {
                console.error('Error en handleRelayMessage:', e);
            }
        }
        function searchLinks() {
            if (isResolved || foundUrl) return;
            if (currentSubId) {
                wsConnections.forEach(ws => {
                    if (ws.readyState === WebSocket.OPEN) {
                        try { ws.send(JSON.stringify(['CLOSE', currentSubId])); } catch(e) {}
                    }
                });
            }
            currentSubId = 'ulink_search_' + Date.now();
            const filter = {
                kinds: [30000],
                "#d": [CONFIG.nostrTreeTag],
                limit: 50
            };
            let sent = 0;
            wsConnections.forEach(ws => {
                if (ws.readyState === WebSocket.OPEN) {
                    try { 
                        ws.send(JSON.stringify(['REQ', currentSubId, filter])); 
                        sent++;
                    } catch(e) {}
                }
            });
            DOM.relayInfo.textContent = 'Buscando en ' + sent + ' relay(s)... (' + shortId + ')';
            setTimeout(() => {
                if (!isResolved) {
                    wsConnections.forEach(ws => {
                        if (ws.readyState === WebSocket.OPEN) {
                            try { ws.send(JSON.stringify(['CLOSE', currentSubId])); } catch(e) {}
                        }
                    });
                    currentSubId = null;
                }
            }, 7000);
        }
        if (shortId) {
            DOM.title.textContent = 'Redirigiendo...';
            DOM.subtitle.textContent = 'Buscando enlace: ' + shortId;
            connectRelays();
        }
    </script>
</body>
</html>
