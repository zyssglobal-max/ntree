<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>u-link - Redirección</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a12;
            color: #f0f0f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at 60% 20%, rgba(74, 124, 191, 0.08), transparent 60%),
                radial-gradient(ellipse at 40% 80%, rgba(201, 168, 76, 0.06), transparent 50%);
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            background: rgba(10, 10, 18, 0.7);
            box-shadow: 0 8px 48px rgba(0,0,0,0.5);
        }
        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.05);
            border-top-color: #7c3aed;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { 
            font-size: 22px; 
            margin-bottom: 8px; 
            color: #f0f0f5;
            font-weight: 700;
        }
        p { 
            color: rgba(255,255,255,0.6); 
            font-size: 14px; 
            margin-bottom: 4px;
            line-height: 1.6;
        }
        .error {
            color: #ef4444;
            font-size: 16px;
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
        }
        .success {
            color: #10b981;
            font-size: 14px;
            margin-top: 8px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #a78bfa;
            text-decoration: none;
            padding: 10px 24px;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(124,58,237,0.3);
            transform: translateY(-2px);
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-dot.online { background: #10b981; animation: pulse 1.5s infinite; }
        .status-dot.offline { background: #ef4444; }
        .status-dot.connecting { background: #f59e0b; animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .relay-info {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .short-id {
            font-family: monospace;
            color: #a78bfa;
            font-size: 16px;
            padding: 4px 12px;
            background: rgba(124,58,237,0.1);
            border-radius: 6px;
            display: inline-block;
            margin-top: 4px;
        }
        .retry-btn {
            margin-top: 12px;
            padding: 8px 20px;
            background: rgba(124,58,237,0.15);
            border: 1px solid rgba(124,58,237,0.2);
            border-radius: 8px;
            color: #a78bfa;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .retry-btn:hover {
            background: rgba(124,58,237,0.25);
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="logo">🔗</div>
        <div class="spinner" id="spinner"></div>
        <h2 id="title">Redirigiendo...</h2>
        <p id="subtitle">Buscando enlace en la red descentralizada</p>
        <div id="shortIdDisplay" style="margin-top:8px;"></div>
        <div class="error" id="error" style="display:none;"></div>
        <div class="success" id="success" style="display:none;"></div>
        <button class="retry-btn" id="retryBtn" style="display:none;">🔄 Reintentar</button>
        <a href="#" class="back-link" id="backLink" style="display:none;">← Volver a u-link</a>
        <div class="relay-info" id="relayInfo">Conectando a relays...</div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN
        // ============================================
        const CONFIG = {
            relays: [
                'wss://relay.damus.io',
                'wss://nos.lol',
                'wss://relay.primal.net',
                'wss://relay.snort.social'
            ],
            nostrTreeTag: 'ulink_shortener',
            maxAttempts: 4,
            timeout: 10000
        };

        // ============================================
        // DOM REFERENCIAS
        // ============================================
        const DOM = {
            spinner: document.getElementById('spinner'),
            title: document.getElementById('title'),
            subtitle: document.getElementById('subtitle'),
            error: document.getElementById('error'),
            success: document.getElementById('success'),
            backLink: document.getElementById('backLink'),
            retryBtn: document.getElementById('retryBtn'),
            relayInfo: document.getElementById('relayInfo'),
            shortIdDisplay: document.getElementById('shortIdDisplay')
        };

        // ============================================
        // OBTENER SHORT ID
        // ============================================
        function getShortId() {
            const params = new URLSearchParams(window.location.search);
            const u = params.get('u');
            if (u) return u;
            
            const path = window.location.pathname;
            const match = path.match(/\/r\/([a-z0-9]+)/);
            return match ? match[1] : null;
        }

        const shortId = getShortId();

        if (!shortId) {
            DOM.spinner.style.display = 'none';
            DOM.title.textContent = '❌ Enlace inválido';
            DOM.subtitle.textContent = 'No se encontró el ID del enlace';
            DOM.error.textContent = 'URL no válida. El enlace corto no tiene un ID válido.';
            DOM.error.style.display = 'block';
            DOM.backLink.style.display = 'inline-block';
            DOM.backLink.href = '#';
            DOM.relayInfo.textContent = 'Error: ID no encontrado';
        } else {
            DOM.shortIdDisplay.innerHTML = `🔑 <span class="short-id">${shortId}</span>`;
            DOM.relayInfo.textContent = `Buscando enlace: ${shortId}`;
        }

        // ============================================
        // TOAST
        // ============================================
        function toast(msg, type = 'info') {
            const el = document.createElement('div');
            el.style.cssText = `
                position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
                padding: 14px 24px; background: rgba(20,20,35,0.95); backdrop-filter: blur(20px);
                border-radius: 12px; color: #f0f0f5; font-size: 14px;
                box-shadow: 0 8px 32px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.06);
                z-index: 9999; animation: slideUp 0.3s ease; max-width: 90%;
            `;
            if (type === 'error') el.style.borderColor = '#ef4444';
            if (type === 'success') el.style.borderColor = '#10b981';
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateX(-50%) translateY(20px)';
                setTimeout(() => el.remove(), 300);
            }, 3500);
        }

        // ============================================
        // CONEXIÓN A RELAYS - SOLO LEER
        // ============================================
        let wsConnections = [];
        let foundUrl = null;
        let attempts = 0;
        let currentSubId = null;
        let timeoutId = null;
        let isResolved = false;

        function connectRelays() {
            if (isResolved) return;
            
            let connectedCount = 0;
            DOM.relayInfo.textContent = `Conectando a ${CONFIG.relays.length} relays...`;
            
            CONFIG.relays.forEach(url => {
                try {
                    const ws = new WebSocket(url);
                    
                    ws.onopen = () => {
                        connectedCount++;
                        console.log(`✅ Conectado a ${url}`);
                        DOM.relayInfo.textContent = `Conectado a ${connectedCount} relay(s)`;
                        if (connectedCount >= 1 && !isResolved) {
                            searchLinks();
                        }
                    };
                    
                    ws.onmessage = (e) => {
                        try {
                            const data = JSON.parse(e.data);
                            handleRelayMessage(data);
                        } catch (err) {
                            console.error('Error parseando mensaje:', err);
                        }
                    };
                    
                    ws.onerror = (err) => {
                        console.warn(`⚠️ Error en ${url}`, err);
                    };
                    
                    ws.onclose = () => {
                        console.warn(`Desconectado de ${url}`);
                        connectedCount--;
                        if (connectedCount === 0 && !foundUrl && !isResolved) {
                            handleDisconnect();
                        }
                    };
                    
                    wsConnections.push(ws);
                } catch (e) {
                    console.error(`❌ Error al conectar a ${url}:`, e);
                }
            });

            // Timeout global
            if (timeoutId) clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
                if (!foundUrl && !isResolved) {
                    attempts++;
                    if (attempts < CONFIG.maxAttempts) {
                        toast(`🔄 Reintentando (${attempts}/${CONFIG.maxAttempts})...`, 'info');
                        wsConnections.forEach(w => { try { w.close(); } catch(e){} });
                        wsConnections = [];
                        connectRelays();
                    } else {
                        showError('❌ Enlace no encontrado', 'No se pudo encontrar el enlace en la red después de varios intentos.');
                    }
                }
                timeoutId = null;
            }, CONFIG.timeout);
        }

        function handleDisconnect() {
            if (isResolved) return;
            attempts++;
            if (attempts < CONFIG.maxAttempts) {
                const delay = Math.min(2000 * attempts, 8000);
                DOM.relayInfo.textContent = `Reconectando en ${delay/1000}s... (${attempts}/${CONFIG.maxAttempts})`;
                setTimeout(() => {
                    wsConnections.forEach(w => { try { w.close(); } catch(e){} });
                    wsConnections = [];
                    connectRelays();
                }, delay);
            } else {
                showError('❌ Enlace no encontrado', 'No se pudo encontrar el enlace en la red. Verifica que el ID sea correcto.');
            }
        }

        function showError(title, msg) {
            if (isResolved) return;
            isResolved = true;
            DOM.spinner.style.display = 'none';
            DOM.title.textContent = title;
            DOM.subtitle.textContent = 'Intenta verificar el enlace';
            DOM.error.textContent = msg;
            DOM.error.style.display = 'block';
            DOM.backLink.style.display = 'inline-block';
            DOM.backLink.href = 'https://github.com';
            DOM.backLink.textContent = '← Volver';
            DOM.retryBtn.style.display = 'inline-block';
            DOM.relayInfo.textContent = '❌ Error al encontrar el enlace';
            
            wsConnections.forEach(w => { try { w.close(); } catch(e){} });
            wsConnections = [];
        }

        function handleRelayMessage(data) {
            if (isResolved) return;
            
            try {
                if (data[0] === 'EVENT' && data.length >= 3) {
                    const event = data[2];
                    if (event.kind !== 30000) return;
                    
                    const hasUlTag = event.tags && event.tags.some(tag =>
                        tag[0] === 'd' && tag[1] === CONFIG.nostrTreeTag
                    );
                    if (!hasUlTag) return;

                    try {
                        const profile = JSON.parse(event.content);
                        if (profile.links && Array.isArray(profile.links)) {
                            const link = profile.links.find(l => l.shortId === shortId);
                            if (link) {
                                foundUrl = link.url;
                                isResolved = true;
                                
                                // Cerrar conexiones
                                wsConnections.forEach(w => { try { w.close(); } catch(e){} });
                                wsConnections = [];
                                if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
                                
                                DOM.spinner.style.display = 'none';
                                DOM.title.textContent = '🔗 Redirigiendo...';
                                DOM.subtitle.textContent = `Enlace encontrado: ${link.title || 'sin título'}`;
                                DOM.success.textContent = '✓ Redirigiendo...';
                                DOM.success.style.display = 'block';
                                DOM.relayInfo.textContent = `✅ Enlace encontrado! Redirigiendo a ${link.url.substring(0, 50)}...`;
                                
                                // Redirigir después de 500ms
                                setTimeout(() => {
                                    window.location.href = foundUrl;
                                }, 600);
                                return;
                            }
                        }
                    } catch (err) {
                        console.error('Error parseando perfil:', err);
                    }
                }
                
                if (data[0] === 'EOSE' && data.length >= 2) {
                    // Fin de la búsqueda en este relay
                    console.log('EOSE recibido para:', data[1]);
                }
            } catch (e) {
                console.error('Error en handleRelayMessage:', e);
            }
        }

        function searchLinks() {
            if (isResolved || foundUrl) return;
            if (currentSubId) {
                wsConnections.forEach(ws => {
                    if (ws.readyState === WebSocket.OPEN) {
                        try { ws.send(JSON.stringify(['CLOSE', currentSubId])); } catch(e) {}
                    }
                });
            }
            
            currentSubId = 'ulink_search_' + Date.now();
            const filter = {
                kinds: [30000],
                "#d": [CONFIG.nostrTreeTag],
                limit: 50
            };
            
            let sent = 0;
            wsConnections.forEach(ws => {
                if (ws.readyState === WebSocket.OPEN) {
                    try { 
                        ws.send(JSON.stringify(['REQ', currentSubId, filter])); 
                        sent++;
                    } catch(e) {}
                }
            });
            
            DOM.relayInfo.textContent = `Buscando en ${sent} relay(s)... (${shortId})`;
            
            // Cerrar suscripción después de un tiempo
            setTimeout(() => {
                if (!isResolved) {
                    wsConnections.forEach(ws => {
                        if (ws.readyState === WebSocket.OPEN) {
                            try { ws.send(JSON.stringify(['CLOSE', currentSubId])); } catch(e) {}
                        }
                    });
                    currentSubId = null;
                }
            }, 7000);
        }

        // ============================================
        // RETRY
        // ============================================
        document.getElementById('retryBtn')?.addEventListener('click', function() {
            if (isResolved) {
                isResolved = false;
                foundUrl = null;
                attempts = 0;
                DOM.error.style.display = 'none';
                DOM.error.textContent = '';
                DOM.spinner.style.display = 'block';
                DOM.title.textContent = 'Redirigiendo...';
                DOM.subtitle.textContent = 'Reintentando conexión...';
                DOM.backLink.style.display = 'none';
                this.style.display = 'none';
                DOM.relayInfo.textContent = 'Reconectando...';
                wsConnections.forEach(w => { try { w.close(); } catch(e){} });
                wsConnections = [];
                connectRelays();
            }
        });

        // ============================================
        // INICIO
        // ============================================
        if (shortId) {
            DOM.title.textContent = '🔗 Redirigiendo...';
            DOM.subtitle.textContent = `Buscando enlace: ${shortId}`;
            connectRelays();
        }
    </script>
</body>
</html>
